---
layout: default
---
<article class="article shell shell-narrow news-detail">
  <header class="article-header">
    <p class="eyebrow">News &amp; Activities · {{ page.date | date: '%Y' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.period %}<p class="article-lede">{{ page.period }}</p>{% endif %}
  </header>
  {% if page.image %}<img class="article-hero" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">{% endif %}
  <div class="article-content">{{ content }}</div>
  <footer class="article-footer"><a class="button button-quiet" href="{{ '/news/' | relative_url }}">← News &amp; Activities</a></footer>
</article>
