---
layout: default
---
<article class="article shell shell-narrow">
  <header class="article-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time>
      {% if page.categories.size > 0 %}<span>{{ page.categories | join: ' · ' }}</span>{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-lede">{{ page.description }}</p>{% endif %}
  </header>
  {% if page.thumbnail %}
    <img class="article-hero" src="{{ page.thumbnail | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">
  {% endif %}
  <div class="article-content">{{ content }}</div>
  <footer class="article-footer">
    <a class="button button-quiet" href="{{ '/blog/' | relative_url }}">← Blog</a>
  </footer>
</article>
