title: "Yunseo Cho"
description: "Robotics, spatial intelligence, research notes, news, and activities."
author: "Yunseo Cho"
lang: ko-KR
timezone: Asia/Seoul
url: ""
baseurl: ""
permalink: /blog/:categories/:year/:month/:day/:title/

hero:
  title: "Hello, World!"
  subtitle: "Robotics, spatial intelligence, and the notes I keep while learning how machines understand places."
  image: /assets/images/hero-wave.webp
  image_alt: "윤슬을 머금고 부서지는 파도"

cv_pdf: ""

markdown: kramdown
highlighter: rouge

collections:
  news:
    output: true
    permalink: /news/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: news
    values:
      layout: news-item

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
